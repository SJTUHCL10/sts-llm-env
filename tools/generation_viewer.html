<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>涅奥 · 生成记录</title>
  <style>
    :root { color-scheme: dark; --bg:#141918; --panel:#1c2422; --line:#35413d; --text:#e4eae5; --muted:#a4b4ab; --accent:#bfd9a8; }
    * { box-sizing:border-box; }
    body { margin:0; font:14px/1.65 "Segoe UI","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); }
    header { padding:22px 28px 16px; border-bottom:1px solid var(--line); }
    h1 { margin:0 0 4px; font-size:23px; font-weight:600; }
    h2 { margin:0 0 12px; font-size:19px; }
    h3 { margin:0 0 8px; font-size:16px; }
    p { margin:6px 0; }
    .muted { color:var(--muted); }
    #directory { overflow-wrap:anywhere; font:12px/1.6 Consolas,monospace; }
    .toolbar { display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; align-items:center; }
    input,select,button { font:inherit; color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:7px; padding:7px 11px; }
    input[type=search] { width:340px; max-width:100%; }
    input[type=checkbox] { accent-color:var(--accent); }
    button { cursor:pointer; }
    button:hover { border-color:var(--accent); }
    button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    #stats { color:var(--accent); margin-top:12px; }
    #error { color:#f1b2a3; white-space:pre-wrap; }
    main { display:grid; grid-template-columns:340px minmax(0,1fr); height:calc(100vh - 218px); min-height:460px; }
    aside { overflow:auto; padding:16px; border-right:1px solid var(--line); }
    #detail { overflow:auto; padding:24px 28px 60px; }
    .session { display:block; text-align:left; width:100%; margin-bottom:9px; padding:12px 14px; }
    .session.active,.request.active { border-color:var(--accent); background:#29362d; }
    .session-title { font-weight:600; }
    .session-file { color:var(--muted); font-size:11px; overflow-wrap:anywhere; margin:5px 0; }
    .badge { display:inline-block; border-radius:5px; padding:1px 7px; font-size:12px; margin:3px 6px 3px 0; background:#303b36; }
    .ready { color:#c1e5a6; background:#304331; }
    .failed { color:#f6b7a5; background:#50362f; }
    .pending { color:#e9d79c; background:#47402e; }
    .discarded { color:#c5c6d3; background:#363644; }
    .requests { display:flex; flex-wrap:wrap; gap:8px; margin:16px 0; }
    .metadata { display:flex; flex-wrap:wrap; gap:7px 22px; color:var(--muted); margin-bottom:12px; }
    .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:14px; margin:16px 0; }
    .card { padding:18px; border:1px solid #52624b; background:linear-gradient(145deg,#2c392d,#1d2822); border-radius:10px; overflow-wrap:anywhere; }
    .card .name { display:flex; gap:16px; justify-content:space-between; font-size:19px; font-weight:600; color:#e2edc5; }
    .card .flavor { color:#b8c8ad; font-style:italic; margin-top:14px; }
    .effect { border-top:1px solid #3c4c3d; padding:8px 0; }
    .effect:first-child { border-top:0; }
    details { border:1px solid var(--line); border-radius:8px; margin:12px 0; background:var(--panel); }
    summary { padding:11px 14px; cursor:pointer; font-weight:600; }
    pre { font:13px/1.7 Consolas,"Microsoft YaHei",monospace; white-space:pre-wrap; overflow-wrap:anywhere; margin:0; padding:0 16px 16px; }
    .reasoning { font-family:"Segoe UI","Microsoft YaHei",sans-serif; }
    .notice { padding:12px 16px; border:1px solid #61513c; border-radius:8px; color:#e9d79c; margin:12px 0; white-space:pre-wrap; }
    .empty { padding:40px 12px; color:var(--muted); }
    .timeline { margin-top:24px; }
    .timeline summary { font-weight:400; }
    .block-heading { position:relative; padding-right:100px; }
    .copy-button { position:absolute; right:10px; top:7px; padding:3px 9px; font-size:12px; font-weight:400; }
    .json-tree { padding:0 16px 16px; font:13px/1.7 Consolas,"Microsoft YaHei",monospace; overflow-wrap:anywhere; }
    .json-node { border:0; border-radius:0; background:transparent; margin:0; }
    .json-node > summary { padding:1px 0; font:inherit; }
    .json-node[open] > summary > .json-preview { display:none; }
    .json-children { margin-left:18px; border-left:1px solid var(--line); padding-left:10px; }
    .json-leaf,.json-close { padding:1px 0 1px 16px; white-space:pre-wrap; }
    .json-key { color:#a9cde5; }
    .json-string { color:#c3dda9; white-space:pre-wrap; }
    .json-number { color:#f0c393; }
    .json-boolean { color:#cdb5ed; }
    .json-null,.json-index,.json-count { color:var(--muted); }
    .json-count { font:11px "Segoe UI","Microsoft YaHei",sans-serif; margin-left:10px; }
    @media(max-width:850px) { main { grid-template-columns:260px minmax(0,1fr); } #detail { padding:20px 16px; } }
    @media(max-width:620px) { header { padding:16px; } main { display:block; height:auto; } aside { max-height:220px; border-bottom:1px solid var(--line); border-right:0; } #detail { overflow:visible; } }
  </style>
</head>
<body>
  <header>
    <h1>涅奥的陪伴 <span class="muted">/ 生成记录</span></h1>
    <div id="directory" class="muted">正在连接本地日志…</div>
    <div class="toolbar">
      <input id="search" type="search" placeholder="搜索文件、卡名、模型、失败原因" aria-label="搜索生成记录">
      <select id="status" aria-label="筛选状态">
        <option value="all">所有状态</option><option value="ready">成功</option><option value="failed">失败</option>
        <option value="pending">待完成</option><option value="discarded">已丢弃</option><option value="warnings">读取异常</option>
      </select>
      <button id="refresh">刷新</button>
      <label><input id="auto" type="checkbox" checked> 每 5 秒刷新</label>
      <span id="updated" class="muted"></span>
    </div>
    <div id="stats"></div><div id="error" role="alert"></div>
  </header>
  <main><aside id="sessions" aria-label="战斗日志"></aside><section id="detail" aria-label="请求详情"><div class="empty">选择一场战斗查看生成记录。</div></section></main>
  <script>
    'use strict';
    const $ = id => document.getElementById(id);
    const labels = {ready:'成功',failed:'失败',pending:'待完成',discarded:'已丢弃'};
    const types = {attack:'攻击',skill:'技能',power:'能力',common:'普通',uncommon:'罕见',rare:'稀有',exhaust:'消耗',ethereal:'虚无',retain:'保留',innate:'固有'};
    const kinds = {damage:'伤害',block:'格挡',draw:'抽牌',energy:'能量',strength:'力量',dexterity:'敏捷',weak:'虚弱',vulnerable:'易伤',poison:'中毒',discard_random_hand:'随机弃牌',exhaust_random_hand:'随机消耗手牌',return_random_discard:'随机弃牌移回手牌',stars:'星'};
    const targets = {self:'自身',enemy:'目标敌人',all_enemies:'所有敌人',random_enemy:'随机敌人'};
    const triggers = {on_play:'打出时',next_turn_start:'下回合开始',turn_start:'回合开始',turn_end:'回合结束',card_played:'打出任意牌后',attack_played:'打出攻击牌后',skill_played:'打出技能牌后',card_drawn:'抽牌后',card_exhausted:'消耗牌后'};
    const conditions = {self_has_block:'自身有格挡',self_hp_below_half:'生命低于一半',target_weak:'目标有虚弱',target_vulnerable:'目标有易伤'};
    const scalings = {self_block:'当前格挡',hand_size:'手牌数',discard_size:'弃牌堆牌数',exhaust_size:'消耗堆牌数',target_poison:'目标中毒层数',self_stars:'当前星数'};
    let index = [], activeFile = null, activeRevision = null, current = null, lastDetail = '', busy = false;
    // Provider text is always inserted as text, including prompts, names and reasoning.
    function el(tag, text, className) {
      const node = document.createElement(tag);
      if (text !== undefined && text !== null) node.textContent = String(text);
      if (className) node.className = className;
      return node;
    }
    function badge(status, text) { return el('span', text ?? labels[status], 'badge '+status); }
    function json(value) { return JSON.stringify(value, null, 2); }
    function time(value) {
      if (!value) return '时间未记录';
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? String(value) : date.toLocaleString('zh-CN', {hour12:false});
    }
    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        const focus = document.activeElement;
        const textarea = el('textarea'); textarea.value = text; textarea.readOnly = true;
        textarea.style.cssText = 'position:fixed;left:-10000px;top:0';
        document.body.append(textarea);
        try {
          textarea.select();
          if (!document.execCommand('copy')) throw new Error('Copy failed');
        } finally { textarea.remove(); focus?.focus(); }
      }
    }
    function jsonField(key) {
      if (key === null) return el('span');
      return typeof key === 'number' ? el('span',key+' ', 'json-index') : el('span',JSON.stringify(key)+': ', 'json-key');
    }
    function jsonNode(value, key=null, open=false, comma=false) {
      const suffix = comma ? ',' : '';
      const entries = value !== null && typeof value === 'object' ? Object.entries(value) : null;
      if (!entries || !entries.length) {
        const row = el('div',undefined,'json-leaf');
        const type = value === null ? 'null' : typeof value;
        row.append(jsonField(key),el('span',JSON.stringify(value),'json-'+type),el('span',suffix));
        return row;
      }
      const array = Array.isArray(value), start = array ? '[' : '{', end = array ? ']' : '}';
      const node = el('details',undefined,'json-node'), heading = el('summary');
      heading.append(jsonField(key),el('span',start),el('span',' … '+end+suffix,'json-preview'),
        el('span',entries.length+(array ? ' 项' : ' 个字段'),'json-count'));
      const children = el('div',undefined,'json-children');
      node.append(heading,children,el('div',end+suffix,'json-close'));
      let rendered = false;
      function populate() {
        if (!node.open || rendered) return;
        rendered = true;
        entries.forEach(([field,child],index) => children.append(jsonNode(child,array ? Number(field) : field,false,index < entries.length-1)));
      }
      node.addEventListener('toggle',populate);
      node.open = open; populate();
      return node;
    }
    function disclosure(title, text, open=false, className='') {
      const node = el('details'); node.open = open;
      const heading = el('summary',undefined,'block-heading');
      const copy = el('button','复制','copy-button'); copy.type = 'button';
      copy.setAttribute('aria-label','复制 '+title);
      copy.onclick = async event => {
        event.preventDefault(); event.stopPropagation();
        try { await copyText(text ?? ''); copy.textContent = '已复制'; }
        catch { copy.textContent = '复制失败'; }
        setTimeout(() => { copy.textContent = '复制'; },1800);
      };
      copy.onkeydown = event => event.stopPropagation();
      heading.append(el('span',title),copy); node.append(heading);
      let parsed, isJson = false;
      if (typeof text === 'string' && /^[\s]*[\[{]/.test(text)) {
        try { parsed = JSON.parse(text); isJson = true; } catch {}
      }
      if (isJson) {
        const tree = el('div',undefined,'json-tree'); node.append(tree);
        let rendered = false;
        function populate() {
          if (!node.open || rendered) return;
          rendered = true; tree.append(jsonNode(parsed,null,true));
        }
        node.addEventListener('toggle',populate); populate();
      } else node.append(el('pre',text,className));
      return node;
    }
    async function api(path) {
      const response = await fetch(path, {cache:'no-store'});
      if (!response.ok) throw new Error('读取失败（HTTP '+response.status+'），请检查目录或刷新重试。');
      return response.json();
    }
    function matches(session) {
      const query = $('search').value.trim().toLowerCase();
      const status = $('status').value;
      const count = status === 'warnings' ? session.warning_count : session[status];
      return (status === 'all' || count > 0) && (!query || json(session).toLowerCase().includes(query));
    }
    function renderList() {
      const sessions = index.filter(matches);
      $('sessions').replaceChildren();
      if (!sessions.length) $('sessions').append(el('div',index.length ? '没有匹配的记录。' : '暂无 .jsonl 日志。生成新记录后点击刷新。','empty'));
      for (const session of sessions) {
        const button = el('button',undefined,'session'+(activeFile === session.file ? ' active':''));
        button.append(el('div',session.floor == null ? session.key : '第 '+session.floor+' 层','session-title'),
                      el('div',time(session.timestamp_utc),'muted'),el('div',session.file,'session-file'));
        for (const status of Object.keys(labels)) if (session[status]) button.append(badge(status,labels[status]+' '+session[status]));
        if (session.warning_count) button.append(badge('pending','异常行 '+session.warning_count));
        if (session.cards.length) button.append(el('div',session.cards.join(' · ')));
        button.onclick = async () => {
          activeFile = session.file; activeRevision = null; lastDetail = ''; renderList();
          $('detail').replaceChildren(el('div','正在读取…','empty'));
          try { await loadDetail(); } catch (error) { $('error').textContent = error.message; }
        };
        $('sessions').append(button);
      }
      const total = field => index.reduce((sum,item) => sum+item[field],0);
      $('stats').textContent = `${index.length} 场战斗 · ${total('requests')} 次请求 · 成功 ${total('ready')} · 失败 ${total('failed')} · 待完成 ${total('pending')} · 丢弃 ${total('discarded')}　|　匹配 ${sessions.length} 场`;
    }
    function renderModernCard(card) {
      const node = el('article',undefined,'card');
      node.append(el('div',card.name ?? '未命名','name'),el('div',[types[card.type] ?? card.type,types[card.rarity] ?? card.rarity].join(' · '),'muted'));
      const actionNames = {damage:'伤害',block:'格挡',draw:'抽牌',gain_energy:'获得能量',gain_stars:'获得星',apply_power:'施加状态',discard:'弃牌',exhaust:'消耗',move:'移动牌',select:'选牌',upgrade:'升级',copy:'复制',transform:'变化',create_card:'生成牌',play:'自动打出',add_keyword:'赋予关键词',remove_keyword:'移除关键词',set_cost:'修改费用',summon:'召唤',forge:'铸造',channel:'生成球',evoke:'激发',orb_passive:'球被动',orb_slots:'球槽',heal:'回血',lose_hp:'失去生命'};
      const format = value => typeof value === 'object' ? JSON.stringify(value) : String(value);
      const appendAction = (parent,action) => {
        if (!action || typeof action !== 'object') return;
        const fields = Object.entries(action).filter(([key]) => key !== 'kind').map(([key,value]) => key+': '+format(value));
        parent.append(el('div',(actionNames[action.kind] ?? action.kind)+(fields.length ? ' · '+fields.join(' · ') : ''),'effect'));
      };
      card.forms.forEach((form,index) => {
        if (!form || typeof form !== 'object') return;
        const cost = form.cost ?? {};
        node.append(el('h4',(index === 0 ? '基础' : '升级')+' · '+(cost.energy_x ? 'X' : cost.energy ?? 0)+' 能量'+(cost.stars !== undefined ? ' · '+(cost.stars_x ? 'X' : cost.stars)+' 星' : '')));
        for (const keyword of form.keywords ?? []) node.append(badge('',types[keyword] ?? keyword));
        for (const action of form.effects ?? []) appendAction(node,action);
        for (const rule of form.rules ?? []) {
          const group = el('div');
          const trigger = rule.trigger ?? {};
          const parts = [triggers[trigger.event] ?? trigger.event,'持续: '+(rule.lifetime ?? 'combat')];
          for (const key of ['filter','occurrence','limit']) if (trigger[key] !== undefined) parts.push(key+': '+format(trigger[key]));
          if (rule.turns !== undefined) parts.push(rule.turns+' 回合');
          if (rule.condition !== undefined) parts.push('条件: '+format(rule.condition));
          group.append(el('div',parts.join(' · '),'muted'));
          for (const action of rule.effects ?? []) appendAction(group,action);
          node.append(group);
        }
      });
      if (card.flavor) node.append(el('p',card.flavor,'flavor'));
      node.append(disclosure('卡牌原始 JSON',json(card)));
      return node;
    }
    function renderCard(card) {
      if (Array.isArray(card.forms)) return renderModernCard(card);
      const node = el('article',undefined,'card');
      const name = el('div',undefined,'name');
      name.append(el('span',card.name ?? '未命名'),el('span',card.cost === -1 ? 'X 能量' : (card.cost ?? '?')+' 能量'));
      node.append(name,el('div',[types[card.type] ?? card.type,types[card.rarity] ?? card.rarity,'v'+(card.schema_version ?? 1)].join(' · '),'muted'));
      const metadata = [];
      if (card.star_cost >= 0) metadata.push('星费用 '+card.star_cost);
      if (card.upgrade_cost) metadata.push('升级费用变化 '+signed(card.upgrade_cost));
      if (card.upgrade_star_cost) metadata.push('升级星费用变化 '+signed(card.upgrade_star_cost));
      if (metadata.length) node.append(el('div',metadata.join(' · '),'muted'));
      for (const keyword of Array.isArray(card.keywords) ? card.keywords : []) node.append(badge('',types[keyword] ?? keyword));
      const effects = el('div');
      for (const effect of Array.isArray(card.effects) ? card.effects : []) {
        if (!effect || typeof effect !== 'object') continue;
        const parts = [triggers[effect.trigger ?? 'on_play'] ?? effect.trigger,targets[effect.target] ?? effect.target,
          (kinds[effect.kind] ?? effect.kind)+' '+effect.amount+(effect.upgrade_amount ? '（升级 '+signed(effect.upgrade_amount)+'）':'')];
        if (effect.repeat > 1) parts.push('重复 '+effect.repeat+' 次');
        if (effect.condition && effect.condition !== 'none') parts.push('条件：'+(conditions[effect.condition] ?? effect.condition));
        if (effect.scaling && effect.scaling !== 'none') parts.push('额外 '+(scalings[effect.scaling] ?? effect.scaling)+' × '+effect.scaling_amount+(effect.scaling_cap > 0 ? '，计数上限 '+effect.scaling_cap:''));
        if (effect.trigger && effect.trigger !== 'on_play') {
          if (effect.trigger !== 'next_turn_start') parts.push(effect.duration === 0 ? '整场战斗' : '持续 '+(effect.duration ?? 1)+' 回合');
          if (['card_played','attack_played','skill_played','card_drawn','card_exhausted'].includes(effect.trigger)) {
            parts.push(effect.max_per_turn === 0 ? '每回合不限次数' : '每回合最多 '+(effect.max_per_turn ?? 1)+' 次');
            if (effect.condition && effect.condition !== 'none' && effect.max_per_turn !== 0) parts.push('条件不满足也计入次数与持续时间');
          }
        }
        effects.append(el('div',parts.join(' · '),'effect'));
      }
      node.append(effects);
      if (card.flavor) node.append(el('p',card.flavor,'flavor'));
      node.append(disclosure('卡牌原始 JSON',json(card)));
      return node;
    }
    function signed(number) { return number > 0 ? '+'+number : String(number); }
    function renderDetail() {
      if (!current) return;
      const root = $('detail'), summary = current.summary;
      root.replaceChildren(el('h2',summary.floor == null ? '战斗生成记录' : '第 '+summary.floor+' 层 · 生成记录'));
      root.append(el('div',summary.file,'session-file'),el('div','本局：'+(summary.run_key ?? '未记录')+' · 时机：'+(summary.timing ?? '未记录'),'muted'));
      if (current.warning_count) root.append(el('div',`跳过 ${current.warning_count} 行无效日志。`+'\n'+current.warnings.map(w => '第 '+w.line+' 行：'+w.reason).join('\n'),'notice'));
      const requests = current.requests;
      const visibleRequests = requests.filter(r => $('status').value === 'all' || $('status').value === 'warnings' || r.status === $('status').value);
      if (!visibleRequests.some(r => r.revision === activeRevision)) activeRevision = visibleRequests.at(-1)?.revision ?? null;
      const buttons = el('div',undefined,'requests');
      for (const request of visibleRequests) {
        const button = el('button',undefined,'request'+(request.revision === activeRevision ? ' active':''));
        button.append(el('span','#'+request.revision+' '),badge(request.status));
        button.onclick = () => { activeRevision = request.revision; renderDetail(); };
        buttons.append(button);
      }
      root.append(buttons);
      const selected = requests.find(r => r.revision === activeRevision);
      if (selected) {
        const req = selected.request ?? {}, response = selected.response ?? {}, result = selected.result ?? {};
        const metadata = el('div',undefined,'metadata');
        metadata.append(el('span',time(selected.timestamp_utc)),el('span','模型：'+(req.model ?? '未记录')),
          el('span','耗时：'+(result.elapsed_ms == null ? '未记录' : (result.elapsed_ms/1000).toFixed(2)+' 秒')),
          el('span','finish_reason：'+(response.finish_reason ?? '未记录')));
        root.append(metadata);
        const tokens = el('div',undefined,'metadata');
        for (const [key,label] of Object.entries({prompt_tokens:'输入 token',completion_tokens:'输出 token',total_tokens:'总 token',prompt_cache_hit_tokens:'缓存命中',prompt_cache_miss_tokens:'缓存未命中'})) tokens.append(el('span',label+'：'+(response[key] ?? '未记录')));
        root.append(tokens);
        if (result.reason) root.append(el('div','原因：'+result.reason+(result.stage ? '\n阶段：'+result.stage:'')+(result.http_status ? '\nHTTP：'+result.http_status:'')+(result.category ? '\n异常类型：'+result.category:''),'notice'));
        if (selected.status === 'pending') root.append(el('div','尚未记录完成结果；请求可能仍在进行，或程序退出前未写入最终记录。','notice'));
        const cards = el('div',undefined,'cards');
        for (const card of result.cards ?? []) cards.append(renderCard(card));
        root.append(cards);
        root.append(disclosure('模型 reasoning',response.reasoning_content ?? '没有记录 reasoning（服务未返回，或记录开关已关闭）。',false,'reasoning'));
        if (req.prompt) {
          root.append(disclosure('System 提示词',req.prompt.system ?? '未记录'));
          let context = req.prompt.user;
          const marker = typeof context === 'string' ? /(?:^|\r?\n)OBSERVATION_JSON:[ \t]*(?:\r?\n)?/.exec(context) : null;
          if (marker) {
            const instructions = context.slice(0, marker.index).trim();
            if (instructions) root.append(disclosure('User 提示词',instructions));
            context = context.slice(marker.index + marker[0].length).trim();
            try { context = json(JSON.parse(context)); } catch {}
            root.append(disclosure('游戏上下文 / OBSERVATION_JSON',context));
          } else {
            try { context = json(JSON.parse(context)); } catch {}
            root.append(disclosure('User 提示词',context ?? '未记录'));
          }
        } else root.append(disclosure('提示词','没有记录提示词（记录开关可能已关闭）。'));
        const options = {...req}; delete options.prompt;
        root.append(disclosure('请求参数',json(options)),disclosure('本次请求全部事件',json(selected.events)));
      } else root.append(el('div','没有符合当前筛选的请求；仍可查看下面的奖励与审计事件。','empty'));
      const timeline = el('details',undefined,'timeline');
      timeline.append(el('summary','战斗完整事件时间线（'+current.events.length+' 条，含奖励审计）'));
      for (const event of current.events) timeline.append(disclosure(time(event.timestamp_utc)+' · '+event.kind,json(event.payload)));
      root.append(timeline);
    }
    async function loadDetail() {
      if (!activeFile) return;
      const file = activeFile;
      const data = await api('/api/session?file='+encodeURIComponent(file));
      if (file !== activeFile) return;
      const serialized = json(data);
      current = data;
      if (serialized !== lastDetail) { lastDetail = serialized; renderDetail(); }
    }
    async function applyFilters() {
      const visible = index.filter(matches);
      if (visible.some(session => session.file === activeFile)) { renderList(); renderDetail(); return; }
      activeFile = visible[0]?.file ?? null; activeRevision = null; current = null; lastDetail = '';
      renderList();
      $('detail').replaceChildren(el('div',activeFile ? '正在读取…' : '没有匹配的记录。','empty'));
      try { await loadDetail(); } catch (error) { $('error').textContent = error.message; }
    }
    async function refresh() {
      if (busy) return; busy = true;
      try {
        const data = await api('/api/sessions');
        index = data.sessions;
        $('directory').textContent = data.directory;
        $('error').textContent = data.errors.map(e => e.file+'：'+e.reason).join('\n');
        if (!index.some(s => s.file === activeFile)) {
          activeFile = index.find(matches)?.file ?? null; activeRevision = null; lastDetail = ''; current = null;
          if (!activeFile) $('detail').replaceChildren(el('div','暂无可查看的记录。','empty'));
        }
        renderList(); await loadDetail();
        $('updated').textContent = '更新于 '+new Date().toLocaleTimeString('zh-CN',{hour12:false});
      } catch (error) { $('error').textContent = error.message+' 本地服务停止后，重新运行查看器即可。'; }
      finally { busy = false; }
    }
    $('search').oninput = applyFilters;
    $('status').onchange = applyFilters;
    $('refresh').onclick = refresh;
    setInterval(() => { if ($('auto').checked && !document.hidden) refresh(); },5000);
    refresh();
  </script>
</body>
</html>
